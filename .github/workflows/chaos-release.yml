name: CHAOS Release

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      chaos_version:
        description: "Optional CHAOS version suffix, for example 1.2"
        required: false

permissions:
  contents: write
  packages: write

concurrency:
  group: chaos-release-main
  cancel-in-progress: false

env:
  CHAOS_RELEASE_MAJOR: "1"
  CHAOS_FIRST_RELEASE_MINOR: "2"

jobs:
  release:
    name: Create release and Docker image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.ref == 'sync/upstream-main'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Compute release version
        id: version
        env:
          INPUT_CHAOS_VERSION: ${{ github.event.inputs.chaos_version }}
        run: |
          git fetch --tags --force

          outline_version="$(node -p "require('./package.json').version")"

          if [ -n "$INPUT_CHAOS_VERSION" ]; then
            chaos_version="$INPUT_CHAOS_VERSION"
          else
            prefix="v${outline_version}-chaos.${CHAOS_RELEASE_MAJOR}."
            latest_minor=""

            while IFS= read -r tag; do
              minor="${tag#"$prefix"}"
              if [[ "$minor" =~ ^[0-9]+$ ]] && { [ -z "$latest_minor" ] || [ "$minor" -gt "$latest_minor" ]; }; then
                latest_minor="$minor"
              fi
            done < <(git tag -l "${prefix}*")

            if [ -z "$latest_minor" ]; then
              chaos_minor="$CHAOS_FIRST_RELEASE_MINOR"
            else
              chaos_minor="$((latest_minor + 1))"
            fi

            chaos_version="${CHAOS_RELEASE_MAJOR}.${chaos_minor}"
          fi

          if [[ ! "$chaos_version" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::CHAOS version must look like 1.2"
            exit 1
          fi

          tag="v${outline_version}-chaos.${chaos_version}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag ${tag} already exists"
            exit 1
          fi

          image_name="$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          echo "outline_version=$outline_version" >> "$GITHUB_OUTPUT"
          echo "chaos_version=$chaos_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"
          echo "base_image_name=${image_name}-base" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push CHAOS base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ${{ steps.version.outputs.base_image_name }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push CHAOS image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.version.outputs.image_name }}:${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.image_name }}:latest
          build-args: |
            BASE_IMAGE=${{ steps.version.outputs.base_image_name }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ steps.version.outputs.tag }}"
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image_name="${{ steps.version.outputs.image_name }}"

          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "CHAOS release based on Outline ${{ steps.version.outputs.outline_version }}.

          Docker image:
          ${image_name}:${{ steps.version.outputs.tag }}"

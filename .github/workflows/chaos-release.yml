name: CHAOS Release

on:
  pull_request:
    types:
      - closed
    branches:
      - chaos-main
  workflow_dispatch:
    inputs:
      bump:
        description: "CHAOS version bump: keep, minor, major, or explicit"
        required: true
        default: minor
        type: choice
        options:
          - keep
          - minor
          - major
          - explicit
      chaos_version:
        description: "Required when bump is explicit, for example 0.1"
        required: false

permissions:
  contents: write
  packages: write

concurrency:
  group: chaos-release-main
  cancel-in-progress: false

env:
  CHAOS_INITIAL_VERSION: "0.1"

jobs:
  release:
    name: Create release and Docker image
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout chaos-main
        uses: actions/checkout@v6
        with:
          ref: chaos-main
          fetch-depth: 0

      - name: Compute release version
        id: version
        env:
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          INPUT_CHAOS_VERSION: ${{ github.event.inputs.chaos_version }}
        run: |
          git fetch --tags --force

          outline_version="$(node -p "require('./package.json').version")"
          latest_chaos_version=""

          while IFS= read -r tag; do
            version="${tag##*-chaos.}"
            if [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then
              if [ -z "$latest_chaos_version" ]; then
                latest_chaos_version="$version"
                continue
              fi

              major="${version%%.*}"
              minor="${version#*.}"
              latest_major="${latest_chaos_version%%.*}"
              latest_minor="${latest_chaos_version#*.}"

              if [ "$major" -gt "$latest_major" ] || { [ "$major" -eq "$latest_major" ] && [ "$minor" -gt "$latest_minor" ]; }; then
                latest_chaos_version="$version"
              fi
            fi
          done < <(git tag -l "*-chaos.*")

          if [ -z "$latest_chaos_version" ]; then
            latest_chaos_version="$CHAOS_INITIAL_VERSION"
            has_existing_chaos_release="false"
          else
            has_existing_chaos_release="true"
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            bump="$INPUT_BUMP"
          else
            head_ref="$(jq -r '.pull_request.head.ref' "$GITHUB_EVENT_PATH")"
            labels="$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH")"

            if [ "$head_ref" = "main" ]; then
              bump="keep"
            elif grep -qx "chaos:major" <<< "$labels"; then
              bump="major"
            elif grep -qx "chaos:minor" <<< "$labels"; then
              bump="minor"
            else
              bump="minor"
            fi
          fi

          case "$bump" in
            keep)
              chaos_version="$latest_chaos_version"
              ;;
            minor)
              if [ "$has_existing_chaos_release" = "false" ]; then
                chaos_version="$CHAOS_INITIAL_VERSION"
              else
                major="${latest_chaos_version%%.*}"
                minor="${latest_chaos_version#*.}"
                chaos_version="${major}.$((minor + 1))"
              fi
              ;;
            major)
              major="${latest_chaos_version%%.*}"
              chaos_version="$((major + 1)).0"
              ;;
            explicit)
              chaos_version="$INPUT_CHAOS_VERSION"
              ;;
            *)
              echo "::error::Unsupported bump value: ${bump}"
              exit 1
              ;;
          esac

          if [[ ! "$chaos_version" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::CHAOS version must look like 0.1"
            exit 1
          fi

          tag="${outline_version}-chaos.${chaos_version}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag ${tag} already exists. Use a CHAOS version bump if this release should produce a new artifact."
            exit 1
          fi

          image_name="$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          echo "outline_version=$outline_version" >> "$GITHUB_OUTPUT"
          echo "chaos_version=$chaos_version" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"
          echo "base_image_name=${image_name}-base" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push CHAOS base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ${{ steps.version.outputs.base_image_name }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push CHAOS image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.version.outputs.image_name }}:${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.image_name }}:latest
          build-args: |
            BASE_IMAGE=${{ steps.version.outputs.base_image_name }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ steps.version.outputs.tag }}"
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image_name="${{ steps.version.outputs.image_name }}"

          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "CHAOS release based on Outline ${{ steps.version.outputs.outline_version }}.

          CHAOS version: ${{ steps.version.outputs.chaos_version }}
          Version bump: ${{ steps.version.outputs.bump }}

          Docker image:
          ${image_name}:${{ steps.version.outputs.tag }}"
